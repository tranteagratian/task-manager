name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build release .app
        run: ./Scripts/make-app.sh release

      - name: Zip app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent TaskManager.app TaskManager.zip

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (tag was likely re-pushed after a rewrite) — updating its asset instead of failing."
            gh release upload "$TAG" build/TaskManager.zip --clobber
          else
            gh release create "$TAG" \
              build/TaskManager.zip \
              --title "$TAG" \
              --generate-notes
          fi
