name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build release .app
        run: ./Scripts/make-app.sh release

      - name: Zip app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent TaskManager.app TaskManager.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/TaskManager.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
